turtlebot3:
    # Stage 1 Inference: Continuous goal navigation (no reset on goal reach)

    task_and_robot_environment_name: 'TurtleBot3World-v0'
    ros_ws_abspath: '/home/ubuntu/simulation_ws'
    launch_file_name: 'stage1_empty.launch'
    stage: 1

    n_episodes: 100
    max_episode_steps: 300 # Robot navigates for up to 300 steps per episode

    # Environment parameters
    running_step: 0.02
    pos_step: 0.01

    # Observations
    new_ranges: 24
    min_range: 0.18
    max_laser_value: 3.5
    min_laser_value: 0.0
    n_actions: 5

    # Collision detection
    max_linear_aceleration: 1.5

    # Arena boundaries
    arena_min_x: -2.0
    arena_max_x: 2.0
    arena_min_y: -2.0
    arena_max_y: 2.0

    # Safe goal spawning boundaries
    safe_arena_min_x: -1.0
    safe_arena_max_x: 1.0
    safe_arena_min_y: -1.0
    safe_arena_max_y: 1.0
    min_spawn_distance: 0.5
    success_threshold: 0.25

    # Reward settings (needed by env even during inference)
    distance_reward_multiplier: 20.0
    turn_penalty_multiplier: 0.3
    yaw_reward_multiplier: 2.0
    time_penalty: -0.1
    goal_reached_reward: 200
    obstacle_hit_penalty: -200
    courage_zone_threshold: 0.5

    # Inference settings
    best_model: 'best_model_stage1.pth' # Relative to trained_models/
    inference_mode: true # Don't end episode on goal reach
    load_pretrained_model: false
