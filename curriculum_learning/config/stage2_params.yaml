turtlebot3:
    # Stage 2: Static obstacles - Learn obstacle avoidance (transfer from stage 1)

    task_and_robot_environment_name: 'TurtleBot3World-v0'
    ros_ws_abspath: '/home/ubuntu/simulation_ws'
    launch_file_name: 'stage2_static_obstacles.launch' # Stage 2 world
    stage: 2
    model_type: 'dueling_dqn'

    # Environment parameters
    running_step: 0.03
    pos_step: 0.01
    max_episode_steps: 400 # More steps for navigation with obstacles

    # Observations
    new_ranges: 24
    min_range: 0.19 # Tighter collision threshold
    max_laser_value: 3.5
    min_laser_value: 0.0
    n_actions: 5

    # Collision detection
    max_linear_aceleration: 1.2 # More sensitive

    # Arena boundaries (4x4 meter bounded box)
    arena_min_x: -2.0
    arena_max_x: 2.0
    arena_min_y: -2.0
    arena_max_y: 2.0

    goal_positions:
        # Safe goal marker positions (x, y) in the 4x4m arena, avoiding all obstacles
        - [-1.5, 0]
        - [0, -1.5]
        - [0, 0]
        - [0, 1.5]
        - [1.5, 0]
        - [-1.5, 1]
        - [1, 1.5]
        - [-1.5, -1]
        - [1, -1.5]
        - [-1, 1.5]
        - [-1, -1.5]
        - [1.5, -1]
        - [1.5, 1]
        - [-1.5, -0.5]
        - [-1.5, 0.5]
        - [1.5, -0.5]
        - [1.5, 0.5]
        - [-0.5, 1.5]
        - [0.5, 1.5]
        - [-0.5, -1.5]
        - [0.5, -1.5]
        - [0, -1]
        - [0, 1]
        - [-1, 0]
        - [1, 0]

    # Safe goal spawning boundaries
    safe_arena_min_x: -1.0
    safe_arena_max_x: 1.0
    safe_arena_min_y: -1.0
    safe_arena_max_y: 1.0
    min_spawn_distance: 0.5
    success_threshold: 0.25

    # DQN parameters - Fine-tuning from stage 1
    gamma: 0.99
    epsilon_start: 0.5 # Start with partial exploration (transfer from stage 1)
    epsilon_end: 0.01
    epsilon_decay: 25000 # Slower decay for obstacle navigation learning
    n_episodes: 3000
    batch_size: 128
    learning_rate: 0.0005 # Lower LR for fine-tuning pretrained weights
    tau: 0.005 # Soft target update coefficient
    replay_memory_size: 100000

    # Reward settings (consistent with stage 1 scale)
    distance_reward_multiplier: 20.0
    turn_penalty_multiplier: 0.3
    yaw_reward_multiplier: 2.0
    time_penalty: -0.1
    goal_reached_reward: 200
    obstacle_hit_penalty: -200
    courage_zone_threshold: 0.5

    # Checkpoint and Mode Settings - Load from stage 1
    load_pretrained_model: true
    checkpoint_file: 'best_model_stage1.pth'
    inference_mode: false
