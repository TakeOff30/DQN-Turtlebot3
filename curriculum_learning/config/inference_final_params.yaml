turtlebot3:
    # Inference: Final evaluation environment

    task_and_robot_environment_name: 'TurtleBot3World-v0'
    ros_ws_abspath: '/home/ubuntu/simulation_ws'
    launch_file_name: 'inference_final.launch'
    stage: 4
    model_type: 'dueling_dqn'
    # model_type: 'dqn'

    # Environment parameters
    running_step: 0.04
    pos_step: 0.01
    max_episode_steps: 1500

    # Observations
    new_ranges: 24 # Samples 24 laser readings from 360 total
    min_range: 0.19
    max_laser_value: 4.0 # truncates laser reading values
    min_laser_value: 0.0
    n_actions: 5

    # Collision detection
    max_linear_aceleration: 1.2

    # Arena boundaries (6x6 meter bounded box)
    arena_min_x: -3.0
    arena_max_x: 3.0
    arena_min_y: -3.0
    arena_max_y: 3.0

    goal_positions:
        # Table 1 (kitchen area) - top-left quadrant
        #- [-2.0, 2.0]   # Near kitchen counter

        # Table 2 (entrance area) - top-right quadrant
        #- [2.0, 2.0]    # Near entrance table

        # Table 3 (center-left) - main dining
        - [-2.0, 1.5] # Left center table
        - [-2.0, 0.0] # Side service point
        - [-2.0, -1.5] # Adjacent seating

        # Table 4 (center-right) - main dining
        - [2.0, 1.5] # Right center table
        - [2.0, 0.0] # Side service point
        - [2.0, -1.5] # Adjacent seating

        # Table 5 (bottom-left) - corner dining
        - [-2.0, -1.5] # Corner table left
        - [-1.5, -2.0] # Back dining area

        # Table 6 (bottom-right) - corner dining
        - [2.0, -1.5] # Corner table right
        #- [1.5, -2.2]   # Back dining area

        # Center aisle waypoints (navigation paths between tables)
        #- [0.0, 1.5]    # North aisle center
        #- [0.0, -1.5]   # South aisle center

        # serving table from the central corridor
        - [-1.0, 0.0] # Left corridor upper
        - [-1.0, 1.5] # Left corridor upper
        - [-1.0, -1.5] # Left corridor lower
        - [1.0, 0.0] # Left corridor upper
        - [1.0, 1.5] # Right corridor upper
        - [1.0, -1.5] # Right corridor lower

    # Safe goal spawning boundaries
    safe_arena_min_x: -2.8
    safe_arena_max_x: 2.8
    safe_arena_min_y: -2.8
    safe_arena_max_y: 2.8
    min_spawn_distance: 0.7
    success_threshold: 0.25

    # DQN parameters
    gamma: 0.99
    epsilon_start: 0.3
    epsilon_end: 0.01
    epsilon_decay: 20000
    n_episodes: 300
    target_update: 100 # N.B. unused, right now soft update is implemented
    batch_size: 128
    learning_rate: 0.00003
    tau: 0.005 # Soft target update coefficient
    replay_memory_size: 100000

    # Reward settings
    distance_reward_multiplier: 20.0
    turn_penalty_multiplier: 0.3
    yaw_reward_multiplier: 2.0
    time_penalty: -0.1
    goal_reached_reward: 200
    obstacle_hit_penalty: -200
    courage_zone_threshold: 0.5

    # Checkpoint and Mode Settings
    load_pretrained_model: true # Load model weights from checkpoint
    checkpoint_file: 'best_model_stage5_raw.pth' # File to load from trained_models directory
    inference_mode: true
    inference_goal_target_count: 3
    inference_third_goal_x: 0.0
    inference_third_goal_y: 2.2
